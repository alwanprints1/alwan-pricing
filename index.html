<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة تسعير مطبعة ألوان</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 15px; color: #0f172a; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #e2e8f0; }
    h1, h2 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; padding: 12px; width: 100%; transition: 0.2s; }
    .btn-whatsapp { background: #10b981; color: white; margin-bottom: 8px; font-size: 15px; }
    .btn-production { background: #2563eb; color: white; font-size: 13px; }
    .result-box { background: #0f172a; color: white; border-radius: 16px; padding: 20px; text-align: center; }
    .price-tag { background: #2563eb; padding: 15px; border-radius: 12px; font-size: 28px; font-weight: 900; margin: 15px 0; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-item { background: #f8fafc; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; font-size: 12px; display: flex; items-center; gap: 5px; }
  </style>
</head>
<body>

  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="margin:0; color:#2563eb;">🎨 مطبعة ألوان - حاسبة التسعير</h2>
  </div>

  <div class="card">
    <h3>بيانات العميل والطلب</h3>
    <div class="grid">
      <div>
        <label>اسم العميل</label>
        <input type="text" id="custName" placeholder="أحمد علي">
      </div>
      <div>
        <label>رقم الواتساب</label>
        <input type="text" id="custPhone" placeholder="01012345678">
      </div>
      <div>
        <label>اسم الشغلانة</label>
        <input type="text" id="jobTitle" placeholder="بروشور A4">
      </div>
    </div>

    <div class="grid">
      <div>
        <label>المقاس (عرض × طول سم)</label>
        <div style="display:flex; gap:5px;">
          <input type="number" id="width" value="10">
          <input type="number" id="height" value="15">
        </div>
      </div>
      <div>
        <label>الكمية المطلوبة</label>
        <input type="number" id="quantity" value="1000">
      </div>
      <div>
        <label>نوع الورق / الخامة</label>
        <select id="paperType">
          <option value="2.5">كوشيه 150 جرام (2.5 ج/فرخ)</option>
          <option value="4.5" selected>كوشيه 300 جرام (4.5 ج/فرخ)</option>
          <option value="1.2">ورق بوند 80 جرام (1.2 ج/فرخ)</option>
          <option value="5.0">دوبلكس 350 جرام (5.0 ج/فرخ)</option>
          <option value="80.0">بنر / فلكس (80 ج/متر)</option>
        </select>
      </div>
    </div>

    <label>التشطيبات الإضافية</label>
    <div class="checkbox-group">
      <label class="checkbox-item"><input type="checkbox" class="finish" value="0.5" data-name="سلفان مط"> سلفان مط (+0.5)</label>
      <label class="checkbox-item"><input type="checkbox" class="finish" value="0.4" data-name="سلفان لامع"> سلفان لامع (+0.4)</label>
      <label class="checkbox-item"><input type="checkbox" class="finish" value="0.2" data-name="قص / بيمة"> قص/تكسير (+0.2)</label>
      <label class="checkbox-item"><input type="checkbox" class="finish" value="1.5" data-name="Spot UV"> Spot UV (+1.5)</label>
      <label class="checkbox-item"><input type="checkbox" class="finish" value="2.0" data-name="بصمة ذهبي/فضي"> بصمة (+2.0)</label>
    </div>

    <div style="margin-top: 15px;">
      <label>نسبة الربح المطلوبة: <span id="marginVal">35</span>%</label>
      <input type="range" id="margin" min="10" max="100" value="35" step="5">
    </div>
  </div>

  <div class="result-box">
    <div style="font-size:14px; opacity:0.8;">السعر النهائي للعميل</div>
    <div class="price-tag"><span id="totalPrice">0</span> <span style="font-size:16px;">جنيه</span></div>
    <div style="font-size:12px; margin-bottom:15px; opacity:0.8;">سعر القطعة الواحدة: <b id="unitPrice">0</b> جنيه</div>

    <button class="btn-whatsapp" onclick="sendWhatsApp()">💬 إرسال عرض السعر للعميل (واتساب)</button>
    <button class="btn-production" onclick="alert('تم تحويل الطلب لسيستم الورشه بنجاح!')">⚡ تحويل لـ أمر إنتاج (ورشة)</button>
  </div>

  <script>
    function calculate() {
      const w = parseFloat(document.getElementById('width').value) || 0;
      const h = parseFloat(document.getElementById('height').value) || 0;
      const qty = parseFloat(document.getElementById('quantity').value) || 1;
      const paperPrice = parseFloat(document.getElementById('paperType').value) || 0;
      const marginPct = parseFloat(document.getElementById('margin').value) || 35;

      document.getElementById('marginVal').innerText = marginPct;

      const areaSqMeters = (w * h) / 10000;
      const itemsPerSheet = Math.max(1, Math.floor(0.35 / (areaSqMeters || 0.01)));
      const sheetsNeeded = Math.ceil(qty / itemsPerSheet);
      const paperCost = sheetsNeeded * paperPrice;
      const printCost = 50 + (qty * 0.15);

      let finishCost = 0;
      document.querySelectorAll('.finish:checked').forEach(cb => {
        finishCost += qty * parseFloat(cb.value);
      });

      const directCost = paperCost + printCost + finishCost;
      const totalPrice = Math.round(directCost * (1 + marginPct / 100));
      const unitPrice = (totalPrice / qty).toFixed(2);

      document.getElementById('totalPrice').innerText = totalPrice;
      document.getElementById('unitPrice').innerText = unitPrice;
    }

    function sendWhatsApp() {
      const phone = document.getElementById('custPhone').value;
      const name = document.getElementById('custName').value || "العميل العزيز";
      const title = document.getElementById('jobTitle').value || "طلب طباعة";
      const price = document.getElementById('totalPrice').innerText;
      const unit = document.getElementById('unitPrice').innerText;
      const qty = document.getElementById('quantity').value;

      if (!phone) {
        alert("يرجى كتابة رقم واتساب العميل أولاً!");
        return;
      }

      let formattedPhone = phone.replace(/\D/g, "");
      if (formattedPhone.startsWith("0")) formattedPhone = "20" + formattedPhone.substring(1);

      const msg = `مرحباً أ/ *${name}* 🌺\nتحية طيبة من *مطبعة ألوان* 🎨\n\nتفاصيل عرض السعر:\n------------------\n📄 *الطلب:* ${title}\n🔢 *الكمية:* ${qty} قطعة\n💰 *الإجمالي:* *${price} جنيه*\nسعر القطعة: ${unit} جنيه\n------------------\nنشرف بخدمتكم دائماً!`;
      window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    calculate();
  </script>
</body>
</html>
